<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>智能 OnCall 助手 v2 - 深色主题</title>
  <defs>
    <!-- 深色主题配色：亮蓝 + 强粉红 -->
    <radialGradient id="eyeCore" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#F5B8FF"/>
      <stop offset="35%" stop-color="#c770db"/>
      <stop offset="60%" stop-color="#0a84ff"/>
      <stop offset="85%" stop-color="#0055b8"/>
      <stop offset="100%" stop-color="#003d82"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#c770db" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5ac8fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#c770db" stop-opacity="0"/>
      <stop offset="85%" stop-color="#f093fb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="40%" stop-color="#c770db"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="50%" stop-color="#5c3a82"/>
      <stop offset="100%" stop-color="#3a8ad4"/>
    </linearGradient>
    <linearGradient id="ringGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c4cc"/>
      <stop offset="50%" stop-color="#c770db"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#c770db" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#0a84ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#c770db" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f093fb" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c770db" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" fill="#0a0a0f" rx="20"/>

  <!-- 外环脉冲 3（最远，强粉红→紫） -->
  <circle cx="100" cy="88" r="72" fill="none" stroke="url(#ringGrad2)" stroke-width="2" opacity="0.15">
    <animate attributeName="r" values="46;74" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.3;0" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- 外环脉冲 2（中距，青→粉红） -->
  <circle cx="100" cy="88" r="58" fill="none" stroke="url(#ringGrad3)" stroke-width="3" opacity="0.25">
    <animate attributeName="r" values="36;62" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.45;0" dur="3.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- 外环脉冲 1（最近，强粉红→蓝） -->
  <circle cx="100" cy="88" r="44" fill="none" stroke="url(#ringGrad1)" stroke-width="4" opacity="0.35">
    <animate attributeName="r" values="26;50" dur="2.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.6s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- 心跳脉冲线（粉红→蓝→粉红） -->
  <path d="M 22,88 L 66,88 L 74,64 L 82,112 L 90,72 L 98,104 L 106,88 L 178,88"
        fill="none" stroke="url(#pulseLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.3;0.75;0.3" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 圆眼外层大范围光晕（粉红为主） -->
  <circle cx="100" cy="88" r="36" fill="url(#eyeGlow)">
    <animate attributeName="r" values="32;38;32" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼环状光晕（粉红环） -->
  <circle cx="100" cy="88" r="28" fill="url(#eyeRing)">
    <animate attributeName="r" values="26;30;26" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼主体（多层径向渐变：白→粉→紫→蓝） -->
  <circle cx="100" cy="88" r="22" fill="url(#eyeCore)" filter="url(#eyeShadow)">
    <animate attributeName="r" values="20;23;20" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼内圈高光环 -->
  <circle cx="100" cy="88" r="14" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼瞳孔 -->
  <circle cx="100" cy="88" r="8" fill="#1a0525" opacity="0.8">
    <animate attributeName="r" values="7;9;7" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 瞳孔内部微光（粉红） -->
  <circle cx="100" cy="88" r="4" fill="#c770db" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼主高光 -->
  <circle cx="93" cy="81" r="6" fill="#FFFFFF" opacity="0.75">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼副高光（右下小点） -->
  <circle cx="106" cy="95" r="2.5" fill="#FFFFFF" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- 文字 -->
  <text x="100" y="172" text-anchor="middle" font-size="26" font-weight="600" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#F8FAFC">
    On<tspan fill="#0a84ff">Call</tspan>
  </text>
  <text x="100" y="192" text-anchor="middle" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#4a5568">
    智能运维助手
  </text>
</svg>
