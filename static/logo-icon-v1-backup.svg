<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>智能 OnCall 助手</title>
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外环脉冲 3 -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.15">
    <animate attributeName="r" values="18;28" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.4;0" dur="3s" repeatCount="indefinite" begin="0.6s"/>
  </circle>

  <!-- 外环脉冲 2 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.25">
    <animate attributeName="r" values="14;24" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>

  <!-- 外环脉冲 1 -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.4">
    <animate attributeName="r" values="10;20" dur="2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- 心跳脉冲线 -->
  <path d="M 8,32 L 22,32 L 25,24 L 28,40 L 31,28 L 34,36 L 37,32 L 56,32"
        fill="none" stroke="url(#coreGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 核心发光体 -->
  <circle cx="32" cy="32" r="8" fill="url(#coreGrad)" filter="url(#glow)">
    <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 核心高光 -->
  <circle cx="30" cy="30" r="3" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
