<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Vigil 智能运维助手 v2</title>
  <defs>
    <!-- 浅色主题配色：苹果蓝 + 强粉红 -->
    <radialGradient id="eyeCore" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F5B8FF"/>
      <stop offset="45%" stop-color="#c770db"/>
      <stop offset="70%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0055a8"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#c770db" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0071e3" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="50%" stop-color="#c770db"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="40%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#c770db" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0071e3" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#c770db" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f093fb" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外环脉冲 3（最远，强粉红） -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#ringGrad2)" stroke-width="1.5" opacity="0.25">
    <animate attributeName="r" values="18;29" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="opacity" values="0.4;0" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
  </circle>

  <!-- 外环脉冲 2（粉红→蓝） -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ringGrad1)" stroke-width="2" opacity="0.35">
    <animate attributeName="r" values="14;24" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- 外环脉冲 1（最近，强粉红） -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" opacity="0.45">
    <animate attributeName="r" values="10;20" dur="2.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.65;0" dur="2.2s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- 心跳脉冲线（粉红→蓝→粉红） -->
  <path d="M 6,32 L 20,32 L 23,24 L 27,42 L 30,26 L 33,38 L 36,32 L 58,32"
        fill="none" stroke="url(#pulseLine)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- 圆眼外层光晕（粉红为主） -->
  <circle cx="32" cy="32" r="14" fill="url(#eyeGlow)">
    <animate attributeName="r" values="12;15;12" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼主体（径向渐变：白→粉→紫→蓝） -->
  <circle cx="32" cy="32" r="9" fill="url(#eyeCore)" filter="url(#glow)">
    <animate attributeName="r" values="8.5;9.5;8.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼瞳孔 -->
  <circle cx="32" cy="32" r="3.5" fill="#2d1040" opacity="0.75">
    <animate attributeName="r" values="3;4;3" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼主高光 -->
  <circle cx="29.5" cy="29.5" r="2.5" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 圆眼副高光 -->
  <circle cx="34" cy="34" r="1.2" fill="#FFFFFF" opacity="0.45">
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
</svg>
