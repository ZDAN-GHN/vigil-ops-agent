<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>智能 OnCall 助手 - 浅色主题</title>
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" fill="#F8FAFC" rx="20"/>

  <!-- 外环脉冲 3 -->
  <circle cx="100" cy="88" r="68" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.1">
    <animate attributeName="r" values="44;72" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0.25;0" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- 外环脉冲 2 -->
  <circle cx="100" cy="88" r="56" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.18">
    <animate attributeName="r" values="34;60" dur="3s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="opacity" values="0.4;0" dur="3s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <!-- 外环脉冲 1 -->
  <circle cx="100" cy="88" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.3">
    <animate attributeName="r" values="24;48" dur="2.4s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite" begin="0s"/>
  </circle>

  <!-- 心跳脉冲线 -->
  <path d="M 26,88 L 68,88 L 76,68 L 84,108 L 92,76 L 100,100 L 108,88 L 174,88"
        fill="none" stroke="url(#coreGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.25;0.65;0.25" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 核心发光体 -->
  <circle cx="100" cy="88" r="20" fill="url(#coreGrad)" filter="url(#glow)">
    <animate attributeName="r" values="18;22;18" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 核心高光 -->
  <circle cx="94" cy="82" r="7" fill="#FFFFFF" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 文字 -->
  <text x="100" y="172" text-anchor="middle" font-size="26" font-weight="600" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1E293B">
    On<tspan fill="#2563EB">Call</tspan>
  </text>
  <text x="100" y="192" text-anchor="middle" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#94A3B8">
    智能运维助手
  </text>
</svg>
